# ros2_control for band_gruppebot i Gazebo
#
#   /joint_states                      <- joint_state_broadcaster
#   /arm_controller/joint_trajectory   -> arm_controller (trajectory_msgs/JointTrajectory)
#
# Rettet: listen med ledd manglet mellomrom etter bindestreken ("-Revolute_1"),
# så YAML leste alle fem leddene som én tekst og arm_controller kunne ikke starte.
controller_manager:
  ros__parameters:
    update_rate: 250  # Hz (Gazebo regner med 500 Hz, se worlds/samleband.sdf)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    update_rate: 100  # Hz, holder for RViz og logging i MATLAB

arm_controller:
  ros__parameters:
    joints:
      - Revolute_1
      - Revolute_2
      - Revolute_3
      - Revolute_4
      - Revolute_5
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    # Posisjonsregulator per ledd (samme oppbygging som i Krav 4, Corke kap. 9.1.7):
    #   fart_kommando = ff_velocity_scale * q_ref_derivert + p * (q_ref - q)
    # p = 25 1/s gir tidskonstant 1/25 = 0,04 s. u_clamp begrenser P-leddet til +-2 rad/s.
    gains:
      Revolute_1: {p: 25.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0, u_clamp_max: 2.0, u_clamp_min: -2.0}
      Revolute_2: {p: 25.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0, u_clamp_max: 2.0, u_clamp_min: -2.0}
      Revolute_3: {p: 25.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0, u_clamp_max: 2.0, u_clamp_min: -2.0}
      Revolute_4: {p: 25.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0, u_clamp_max: 2.0, u_clamp_min: -2.0}
      Revolute_5: {p: 25.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0, u_clamp_max: 2.0, u_clamp_min: -2.0}
    # Banen fra MATLAB kan slutte med fart (f.eks. lik båndfarten)
    allow_nonzero_velocity_at_trajectory_end: true
